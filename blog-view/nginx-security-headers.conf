# 公共安全响应头。
# 注意：nginx 的 add_header 不会跨级继承 —— location 内只要有自己的 add_header，
# server 级的头部就会失效，因此每个带 add_header 的 location 都必须 include 本文件。

# 防止浏览器根据内容猜测 MIME 类型
add_header X-Content-Type-Options "nosniff" always;
# 禁止被外部站点 iframe 嵌套
add_header X-Frame-Options "SAMEORIGIN" always;
# 控制 Referrer 泄露
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 限制浏览器能力（本站用不到摄像头/麦克风/定位）
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP：允许自身 + giscus 评论 iframe + 站外图片/字体
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://giscus.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://giscus.app https://cdn.jsdelivr.net; frame-src https://giscus.app; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

# HSTS：仅在 HTTPS 已就绪（外层网关/CDN 已挂证书）后取消注释启用。
# 该头在 HTTP 响应中会被浏览器忽略，误开无副作用，但建议真正上 HTTPS 后再放开。
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

