[project]
name = "eleven-blog-api"
version = "0.1.0"
description = "Eleven Blog 的 FastAPI 渐进式迁移后端"
requires-python = ">=3.11"
dependencies = [
    "asyncmy>=0.2.10",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.32",
    "redis>=5.2,<6.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
