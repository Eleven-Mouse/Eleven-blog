services:
  blog:
    build:
      context: ./blog-view
      args:
        GITHUB_CONTENT_OWNER: ${GITHUB_CONTENT_OWNER:-}
        GITHUB_CONTENT_REPO: ${GITHUB_CONTENT_REPO:-}
        GITHUB_CONTENT_BRANCH: ${GITHUB_CONTENT_BRANCH:-main}
        GITHUB_CONTENT_ROOT: ${GITHUB_CONTENT_ROOT:-}
        GITHUB_CONTENT_TOKEN: ${GITHUB_CONTENT_TOKEN:-}
    image: eleven-blog:local
    container_name: eleven-blog
    restart: unless-stopped
    ports:
      - "${BLOG_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
