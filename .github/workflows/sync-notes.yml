name: Sync notes submodule

on:
  repository_dispatch:
    types: [notes-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update notes submodule to latest
        run: |
          git submodule update --init --remote blog-view/notes
          echo "主仓库记录的指针: $(git ls-tree HEAD blog-view/notes | awk '{print $3}')"
          echo "子模块已更新到: $(git -C blog-view/notes rev-parse HEAD)"

      - name: Commit and push if changed
        run: |
          OLD=$(git ls-tree HEAD blog-view/notes | awk '{print $3}')
          NEW=$(git -C blog-view/notes rev-parse HEAD)
          echo "旧指针: $OLD  新指针: $NEW"
          if [ "$OLD" = "$NEW" ]; then
            echo "Notes submodule already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog-view/notes
            git commit -m "chore(notes): 同步笔记子模块指针"
            git push
          fi
