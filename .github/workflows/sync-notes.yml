name: Sync notes submodule

on:
  repository_dispatch:
    types: [notes-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update notes submodule to latest
        run: git submodule update --remote blog-view/notes

      - name: Commit and push if changed
        run: |
          if git diff --quiet blog-view/notes; then
            echo "Notes submodule already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog-view/notes
            git commit -m "chore(notes): 同步笔记子模块指针"
            git push
          fi
